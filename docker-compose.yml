# docker-compose.yml — local Evolution API + Postgres for staysmart_fixed
#
# This file is mounted at staysmart_fixed/ and is REPLACED in staysmart_fixed/,
# the fixed repo. To boot:
#   1. cp .env.local.example .env.local
#   2. docker compose up -d
#   3. ngrok http 8080   →  paste the HTTPS URL into EVOLUTION_WEBHOOK_BASE
#
# Volume on evolution_data persists the auth files (QR sessions) so you don't
# have to re-scan the WhatsApp QR after each restart.

services:
  evolution-api:
    image: atendai/evolution-api:v2.0.0           # pin a known-good release
    container_name: staysmart_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"                               # API server
    environment:
      # ---- Auth mode ----
      AUTHENTICATION_TYPE:                       "apikey"
      AUTHENTICATION_API_KEY:                    "${EVOLUTION_API_KEY:-local-evolution-secret}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES:  "false"

      # ---- Webhook delivery (ngrok-fronted) ----
      # webhook.global.url points at the public ngrok URL that fronts the
      # Supabase Edge Function `wa-webhook`.
      WEBHOOK_GLOBAL_ENABLED:                    "true"
      WEBHOOK_GLOBAL_URL:                        "${NGROK_URL:-http://host.docker.internal:54321}/functions/v1/wa-webhook"
      WEBHOOK_EVENTS_MESSAGES_UPSERT:            "true"
      WEBHOOK_EVENTS_MESSAGES_DELETE:            "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE:          "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED:             "true"
      WEBHOOK_EVENTS_SEND_MESSAGE:               "true"
      # Per-instance headers (some versions support it)
      WEBHOOK_GLOBAL_HEADERS:                    '{"apikey":"${SUPABASE_SERVICE_ROLE_KEY:-dev}"}'

      # ---- Misc ----
      STORE_ENABLED:                             "true"
      STORE_MESSAGES:                            "true"
      CACHE_REDIS_ENABLED:                       "false"
      LOG_LEVEL:                                 "INFO"
    volumes:
      - evolution_data:/evolution/instances       # persist WhatsApp sessions across restarts
    extra_hosts:
      - "host.docker.internal:host-gateway"       # Linux/Windows/Mac interop
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  evolution-postgres:
    image: postgres:16-alpine
    container_name: staysmart_evolution_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER:     evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB:       evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    # NOT exposed to host — Evolution API connects over the docker network.

volumes:
  evolution_data:
  evolution_pg:
